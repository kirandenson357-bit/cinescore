<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineScore — Film Reviews</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F5F7;--card:#fff;--text:#1D1D1F;--sub:#6E6E73;--muted:#AEAEB2;
  --accent:#E8173A;--gold:#FF9F0A;--border:#E5E5EA;--nav-h:64px;
  --r:14px;--r-sm:10px;--r-xs:8px;
  --sh-sm:0 2px 10px rgba(0,0,0,.06);--sh-md:0 8px 30px rgba(0,0,0,.10);--sh-lg:0 20px 60px rgba(0,0,0,.16);
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;background:none;font-family:inherit}
img{display:block;max-width:100%}
input,textarea,select{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:100;background:rgba(255,255,255,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.07);display:flex;align-items:center;padding:0 24px;gap:16px}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;letter-spacing:-.5px;white-space:nowrap;cursor:pointer;flex-shrink:0}
.nav-logo span{color:var(--accent)}
.nav-search{flex:1;max-width:420px;position:relative;margin:0 auto}
.nav-search input{width:100%;height:36px;background:#F1F1F3;border:1.5px solid transparent;border-radius:99px;padding:0 16px 0 38px;font-size:14px;outline:none;transition:all .2s;color:var(--text)}
.nav-search input:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,23,58,.08)}
.nav-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.nav-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.nav-btn{height:34px;padding:0 14px;border-radius:99px;font-size:13px;font-weight:500;color:var(--sub);transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.nav-btn:hover{background:#F1F1F3;color:var(--text)}
.nav-btn.active{color:var(--accent);background:rgba(232,23,58,.07)}
.nav-wl-badge{background:var(--accent);color:#fff;border-radius:99px;font-size:10px;padding:1px 5px;font-weight:700;min-width:16px;text-align:center;line-height:14px}
.nav-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0}
.user-pill{display:flex;align-items:center;gap:8px;padding:3px 12px 3px 4px;background:#F1F1F3;border-radius:99px;cursor:default}
.user-pill span{font-size:13px;font-weight:500}

/* PAGE */
.page{padding-top:var(--nav-h);min-height:100vh}

/* HERO */
.hero{position:relative;height:520px;display:flex;align-items:flex-end;overflow:hidden;margin-bottom:48px}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.5) saturate(1.3)}
.hero-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.05) 100%)}
.hero-content{position:relative;z-index:2;padding:0 48px 48px;max-width:680px}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border-radius:99px;margin-bottom:16px}
.hero-title{font-family:'Cormorant Garamond',serif;font-size:clamp(34px,4.5vw,54px);font-weight:700;color:#fff;line-height:1.08;margin-bottom:14px;text-shadow:0 2px 24px rgba(0,0,0,.4)}
.hero-meta{display:flex;align-items:center;gap:14px;color:rgba(255,255,255,.75);font-size:14px;margin-bottom:20px;flex-wrap:wrap}
.hero-rating{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);padding:5px 12px;border-radius:99px;font-weight:700;color:#FFD60A}
.hero-desc{color:rgba(255,255,255,.7);font-size:14.5px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:24px}
.hero-actions{display:flex;gap:10px}
.btn-primary{height:42px;padding:0 22px;background:var(--accent);color:#fff;border-radius:99px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:all .2s;border:none;cursor:pointer}
.btn-primary:hover{background:#c9112f;transform:translateY(-1px);box-shadow:0 8px 24px rgba(232,23,58,.4)}
.btn-outline-hero{height:42px;padding:0 22px;background:rgba(255,255,255,.12);color:#fff;border-radius:99px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:all .2s;border:1.5px solid rgba(255,255,255,.3);cursor:pointer}
.btn-outline-hero:hover{background:rgba(255,255,255,.22)}
.hero-dots{position:absolute;bottom:22px;right:48px;display:flex;gap:6px;z-index:3}
.hero-dot{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.3);cursor:pointer;transition:all .3s}
.hero-dot.active{width:22px;background:#fff}

/* SECTION */
.section{padding:0 24px;max-width:1320px;margin:0 auto 48px}
.section-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}
.section-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;letter-spacing:-.3px}
.section-link{font-size:13px;color:var(--accent);font-weight:500;cursor:pointer}

/* FILTER BAR */
.filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.genre-pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.genre-pills::-webkit-scrollbar{display:none}
.genre-pill{height:34px;padding:0 16px;border-radius:99px;font-size:13px;font-weight:500;border:1.5px solid var(--border);background:var(--card);color:var(--sub);white-space:nowrap;transition:all .18s;cursor:pointer;flex-shrink:0}
.genre-pill:hover{border-color:var(--accent);color:var(--accent)}
.genre-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.sort-select{height:34px;padding:0 10px;border-radius:var(--r-xs);border:1.5px solid var(--border);background:var(--card);font-size:13px;color:var(--text);outline:none;cursor:pointer;flex-shrink:0}

/* MOVIE GRID */
.movie-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px}
.movie-card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-sm);transition:transform .25s,box-shadow .25s;cursor:pointer}
.movie-card:hover{transform:translateY(-5px);box-shadow:var(--sh-md)}
.movie-poster{position:relative;aspect-ratio:2/3;overflow:hidden;background:#ddd}
.movie-poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.movie-card:hover .movie-poster img{transform:scale(1.05)}
.poster-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75) 0%,transparent 55%);opacity:0;transition:opacity .25s;display:flex;align-items:flex-end;padding:10px}
.movie-card:hover .poster-overlay{opacity:1}
.poster-quick-btns{display:flex;gap:7px}
.quick-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;transition:all .18s;cursor:pointer}
.quick-btn:hover{background:rgba(255,255,255,.32)}
.quick-btn.wl-active{background:var(--accent);border-color:var(--accent)}
.movie-info{padding:12px 13px 14px}
.movie-score{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.score-badge{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:700}
.movie-year{font-size:12px;color:var(--muted)}
.movie-title{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:700;line-height:1.3;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.movie-genre-tag{font-size:11px;color:var(--sub);font-weight:500}

/* FEATURED SCROLL ROW — FIX: poster needs explicit height */
.featured-scroll{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.featured-scroll::-webkit-scrollbar{display:none}
.featured-card{flex:0 0 290px;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-sm);cursor:pointer;transition:transform .25s,box-shadow .25s;display:flex;height:120px}
.featured-card:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.featured-poster{width:82px;flex-shrink:0;background:#ddd;overflow:hidden;position:relative}
.featured-poster img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
.featured-body{padding:13px;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
.featured-rank{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.7px;text-transform:uppercase}
.featured-title{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.featured-score{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700}
.featured-genre{font-size:11px;color:var(--sub)}

/* DETAIL PAGE */
.detail-page{min-height:100vh}
.detail-hero{position:relative;height:380px;overflow:hidden}
.detail-hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:brightness(.28) saturate(1.2)}
.detail-hero-grad{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.1) 0%,var(--bg) 100%)}
.detail-content{max-width:1100px;margin:0 auto;padding:0 28px 80px}
.detail-header{display:grid;grid-template-columns:220px 1fr;gap:36px;margin-top:-130px;position:relative;z-index:2;align-items:start}
.detail-poster{border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-lg);aspect-ratio:2/3;background:#ddd}
.detail-poster img{width:100%;height:100%;object-fit:cover;display:block}
.detail-meta{padding-top:140px}
.detail-genres{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.detail-genre-tag{padding:3px 11px;border-radius:99px;background:var(--bg);border:1.5px solid var(--border);font-size:12px;font-weight:500;color:var(--sub)}
.detail-title{font-family:'Cormorant Garamond',serif;font-size:clamp(30px,3.8vw,46px);font-weight:700;line-height:1.08;margin-bottom:10px}
.detail-subtitle{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--sub);margin-bottom:20px;flex-wrap:wrap}
.detail-subtitle span{display:flex;align-items:center;gap:4px}
.detail-rating-block{display:flex;align-items:center;gap:20px;margin-bottom:22px;padding:18px 22px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh-sm);width:fit-content;flex-wrap:wrap}
.rating-circle{width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--rc,#FF9F0A) calc(var(--pct)*1%),#EBEBF0 0);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rating-circle-inner{width:54px;height:54px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.rating-num{font-size:17px;font-weight:800;line-height:1}
.rating-denom{font-size:10px;color:var(--muted)}
.rating-info{display:flex;flex-direction:column;gap:3px}
.rating-label{font-size:11px;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.rating-big{font-size:22px;font-weight:800;display:flex;align-items:center;gap:3px}
.rating-votes{font-size:12px;color:var(--muted)}
.vdivider{width:1px;height:44px;background:var(--border);flex-shrink:0}
.user-rate-block{display:flex;flex-direction:column;gap:5px}
.user-rate-label{font-size:11px;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.star-row{display:flex;gap:3px}
.star{font-size:21px;cursor:pointer;transition:transform .15s,color .15s;line-height:1;color:var(--muted)}
.star:hover,.star.filled{color:var(--gold)}
.star:hover{transform:scale(1.22)}
.user-rated-label{font-size:11px;color:var(--gold);font-weight:600}
.detail-synopsis{font-size:15px;line-height:1.72;color:var(--sub);margin-bottom:28px;max-width:600px}
.detail-cta{display:flex;gap:10px;flex-wrap:wrap}
.btn-wl{height:42px;padding:0 22px;border-radius:99px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;border:2px solid var(--border);color:var(--sub);transition:all .2s;background:var(--card);cursor:pointer}
.btn-wl:hover{border-color:var(--accent);color:var(--accent);background:rgba(232,23,58,.04)}
.btn-wl.in-list{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-trailer{height:42px;padding:0 22px;border-radius:99px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;background:#1D1D1F;color:#fff;transition:all .2s;cursor:pointer;border:none}
.btn-trailer:hover{background:#3a3a3c;transform:translateY(-1px)}

/* CAST */
.cast-scroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.cast-scroll::-webkit-scrollbar{display:none}
.cast-card{flex:0 0 100px;text-align:center}
.cast-avatar{width:68px;height:68px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff}
.cast-name{font-size:12px;font-weight:600;margin-bottom:2px;line-height:1.3;word-break:break-word}
.cast-role{font-size:11px;color:var(--muted)}

/* REVIEWS */
.review-section{margin-top:36px}
.review-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.review-avg{display:flex;align-items:center;gap:10px}
.review-avg-num{font-family:'Cormorant Garamond',serif;font-size:46px;font-weight:700;line-height:1;color:var(--gold)}
.review-stars-block{display:flex;flex-direction:column;gap:3px}
.review-stars-row{display:flex;gap:2px;font-size:15px}
.review-count-txt{font-size:12px;color:var(--sub)}
.review-list{display:flex;flex-direction:column;gap:14px}
.review-card{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh-sm)}
.review-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:11px}
.review-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.review-user-info{flex:1;min-width:0}
.review-username{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.verified-badge{font-size:10px;color:#30D158;font-weight:700;background:rgba(48,209,88,.1);padding:1px 6px;border-radius:99px}
.review-date{font-size:11px;color:var(--muted);margin-top:1px}
.review-score{font-size:13px;font-weight:700;display:flex;align-items:center;gap:3px;white-space:nowrap}
.review-body{font-size:14px;color:var(--sub);line-height:1.62;margin-bottom:12px}
.review-actions{display:flex;gap:8px}
.react-btn{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);padding:5px 11px;border-radius:var(--r-xs);background:var(--bg);transition:all .18s;cursor:pointer;border:none;font-family:inherit}
.react-btn:hover{color:var(--text);background:var(--border)}
.react-btn.liked{color:#30D158;background:rgba(48,209,88,.1)}
.react-btn.disliked{color:var(--accent);background:rgba(232,23,58,.1)}

/* ADD REVIEW */
.add-review-card{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--sh-sm);margin-bottom:20px}
.add-review-title{font-weight:700;font-size:15px;margin-bottom:14px}
.form-label{font-size:12px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.form-star-row{display:flex;gap:5px;margin-bottom:14px;align-items:center}
.form-star{font-size:24px;cursor:pointer;transition:transform .15s,color .15s;color:var(--muted);line-height:1}
.form-star:hover,.form-star.active{color:var(--gold)}
.form-star:hover{transform:scale(1.18)}
.form-rating-label{font-size:13px;font-weight:700;color:var(--gold);margin-left:6px}
.review-textarea{width:100%;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:11px 14px;font-size:14px;resize:vertical;min-height:88px;outline:none;transition:border-color .2s;background:var(--bg);color:var(--text);line-height:1.5}
.review-textarea:focus{border-color:var(--accent);background:#fff}
.form-footer{display:flex;justify-content:flex-end;margin-top:10px}
.submit-btn{height:38px;padding:0 20px;background:var(--accent);color:#fff;border-radius:99px;font-size:13px;font-weight:600;transition:all .2s;cursor:pointer;border:none}
.submit-btn:hover:not(:disabled){background:#c9112f}
.submit-btn:disabled{opacity:.38;cursor:not-allowed}
.review-submitted{text-align:center;padding:28px 20px}

/* WATCHLIST PAGE */
.watchlist-page{max-width:1100px;margin:0 auto;padding:32px 24px 80px}
.watchlist-title{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:700;margin-bottom:6px}
.watchlist-subtitle{font-size:15px;color:var(--sub);margin-bottom:32px}
.watchlist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
/* FIX: watchlist item needs min-height and poster needs position:relative for absolute img */
.watchlist-item{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-sm);display:flex;transition:transform .2s,box-shadow .2s;min-height:110px}
.watchlist-item:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.wl-poster{width:76px;flex-shrink:0;background:#ddd;overflow:hidden;position:relative}
.wl-poster img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
.wl-body{padding:13px 14px;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.wl-title{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:700;margin-bottom:3px;cursor:pointer;line-height:1.3}
.wl-title:hover{color:var(--accent)}
.wl-meta{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;margin-bottom:7px}
.wl-score{font-size:13px;font-weight:700;display:flex;align-items:center;gap:3px;margin-bottom:10px}
.wl-remove{height:26px;padding:0 12px;border-radius:99px;font-size:11px;font-weight:600;color:var(--accent);border:1.5px solid rgba(232,23,58,.25);transition:all .18s;background:rgba(232,23,58,.04);cursor:pointer;align-self:flex-start}
.wl-remove:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* SEARCH PAGE */
.search-page{max-width:1100px;margin:0 auto;padding:32px 24px 80px}
.search-page-title{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;margin-bottom:3px}
.search-page-sub{font-size:14px;color:var(--sub);margin-bottom:24px}
.search-filters{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.search-filter-select{height:34px;padding:0 10px;border:1.5px solid var(--border);border-radius:var(--r-xs);background:var(--card);font-size:13px;color:var(--text);outline:none;cursor:pointer}
.search-filter-label{font-size:13px;font-weight:600;color:var(--sub)}
.no-results{text-align:center;padding:64px 20px;color:var(--muted)}

/* EMPTY STATE */
.empty-state{text-align:center;padding:80px 20px}
.empty-icon{font-size:52px;margin-bottom:14px;opacity:.25}
.empty-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;margin-bottom:8px}
.empty-desc{font-size:14px;color:var(--sub);line-height:1.6;max-width:280px;margin:0 auto}

/* BACK BTN — FIX: add proper padding-bottom so it's not flush against content */
.back-btn{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;color:var(--sub);padding:10px 0 20px;cursor:pointer;transition:color .18s;border:none;background:none;font-family:inherit}
.back-btn:hover{color:var(--text)}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:36px 0}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);background:#1D1D1F;color:#fff;padding:11px 20px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500;box-shadow:var(--sh-lg);z-index:300;transition:transform .32s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:8px;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

/* TRAILER MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.modal-box{background:#000;border-radius:var(--r);overflow:hidden;width:100%;max-width:820px;aspect-ratio:16/9;position:relative;box-shadow:var(--sh-lg)}
.modal-box iframe{width:100%;height:100%;border:none;display:block}
.modal-close{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;transition:background .18s;z-index:1}
.modal-close:hover{background:rgba(255,255,255,.3)}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .35s ease both}

@media(max-width:860px){

// ── PosterImg: fills parent container, graceful emoji fallback ──
function PosterImg({src, alt}){
  const [err, setErr] = React.useState(false);
  if(err) return (
    <div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",
      background:"linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)",
      color:"rgba(255,255,255,.18)",fontSize:32}}>🎬</div>
  );
  return (
    <img src={src} alt={alt}
      style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}
      onError={()=>setErr(true)}/>
  );
}

// ── NAVBAR ──
// BUG FIX: useEffect syncs localQ when parent resets searchQuery (e.g. logo click)
function Navbar({view, setView, watchlistCount, searchQuery, setSearchQuery}){
  const [localQ, setLocalQ] = React.useState(searchQuery);
  React.useEffect(()=>{ setLocalQ(searchQuery); },[searchQuery]);

  const handleChange = e=>{
    const v = e.target.value;
    setLocalQ(v);
    setSearchQuery(v);
    setView(v.trim()?{page:"search"}:{page:"home"});
  };

  const goHome = ()=>{ setView({page:"home"}); setSearchQuery(""); };

  return (
    <nav className="nav">
      <div className="nav-logo" onClick={goHome}>Cine<span>Score</span></div>

      <div className="nav-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input placeholder="Search movies, genres, years…" value={localQ} onChange={handleChange}/>
      </div>

      <div className="nav-right">
        <button className={`nav-btn${view.page==="home"?" active":""}`} onClick={goHome}>Home</button>
        <button className={`nav-btn${view.page==="watchlist"?" active":""}`} onClick={()=>setView({page:"watchlist"})}>
          Watchlist
          {watchlistCount>0&&<span className="nav-wl-badge">{watchlistCount}</span>}
        </button>
        <div className="user-pill">
          <div className="nav-avatar">{DUMMY_USER.avatar}</div>
          <span>{DUMMY_USER.name.split(" ")[0]}</span>
        </div>
      </div>
    </nav>
  );
}

// ── HERO ──
function Hero({movies, onSelect, watchlist, toggleWatchlist}){
  const featured = movies.filter(m=>m.featured||m.trending).slice(0,5);
  const [idx, setIdx] = React.useState(0);
  React.useEffect(()=>{
    const t = setInterval(()=>setIdx(i=>(i+1)%featured.length),5500);
    return()=>clearInterval(t);
  },[featured.length]);
  const m = featured[idx]||featured[0];
  if(!m) return null;
  return (
    <div className="hero">
      <div className="hero-bg" style={{backgroundImage:`url(${m.backdrop})`}}/>
      <div className="hero-grad"/>
      <div className="hero-content">
        <div className="hero-badge">★ {m.trending?"Trending Now":"Featured"}</div>
        <h1 className="hero-title">{m.title}</h1>
        <div className="hero-meta">
          <div className="hero-rating">★ {m.rating}</div>
          <span>{m.year}</span><span>{m.duration} min</span><span>{m.genre[0]}</span>
        </div>
        <p className="hero-desc">{m.synopsis}</p>
        <div className="hero-actions">
          <button className="btn-primary" onClick={()=>onSelect(m.id)}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            View Details
          </button>
          <button className="btn-outline-hero" onClick={e=>{e.stopPropagation();toggleWatchlist(m.id)}}>
            {watchlist.has(m.id)?"✓ In Watchlist":"+ Watchlist"}
          </button>
        </div>
      </div>
      <div className="hero-dots">

function TrailerModal({url, onClose}){
  React.useEffect(()=>{
    const fn = e=>{ if(e.key==="Escape") onClose(); };
    window.addEventListener("keydown",fn);
    return()=>window.removeEventListener("keydown",fn);
  },[onClose]);
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>✕</button>
        <iframe src={url+"?autoplay=1&rel=0"}
          allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture"
          allowFullScreen/>
      </div>
    </div>
  );
}

// ── SEARCH PAGE ──
function SearchPage({movies, query, onSelect, watchlist, toggleWatchlist}){
  const [minRating, setMinRating] = React.useState("0");
  const [genre,     setGenre]     = React.useState("All");
  const [year,      setYear]      = React.useState("All");
  const [sortBy,    setSortBy]    = React.useState("rating");
  const allYears = ["All",...[...new Set(movies.map(m=>String(m.year)))].sort((a,b)=>b-a)];

  const results = React.useMemo(()=>{
    const q = query.toLowerCase().trim();
    let l = movies.filter(m=>{
      const mQ = !q||m.title.toLowerCase().includes(q)||m.genre.some(g=>g.toLowerCase().includes(q))||String(m.year).includes(q)||m.director.toLowerCase().includes(q);
      const mG = genre==="All"||m.genre.includes(genre);
      const mY = year==="All"||String(m.year)===year;
      const mR = m.rating>=parseFloat(minRating);
      return mQ&&mG&&mY&&mR;
    });
    if(sortBy==="rating") return l.sort((a,b)=>b.rating-a.rating);
    if(sortBy==="year")   return l.sort((a,b)=>b.year-a.year);
    if(sortBy==="title")  return l.sort((a,b)=>a.title.localeCompare(b.title));
    return l;
  },[movies,query,genre,year,minRating,sortBy]);

  return (
    <div className="search-page">
      <h1 className="search-page-title">{query?`Results for "${query}"`:"Browse All Movies"}</h1>
      <p className="search-page-sub">{results.length} film{results.length!==1?"s":""} found</p>

      <div className="search-filters">
        <span className="search-filter-label">Filter:</span>
        <select className="search-filter-select" value={genre} onChange={e=>setGenre(e.target.value)}>
          <option value="All">All Genres</option>
          {GENRES.slice(1).map(g=><option key={g} value={g}>{g}</option>)}
        </select>
        <select className="search-filter-select" value={year} onChange={e=>setYear(e.target.value)}>
          {allYears.map(y=><option key={y} value={y}>{y==="All"?"All Years":y}</option>)}
        </select>
        <select className="search-filter-select" value={minRating} onChange={e=>setMinRating(e.target.value)}>
          <option value="0">Any Rating</option>
          <option value="9">9+ Exceptional</option>
          <option value="8">8+ Great</option>
          <option value="7">7+ Good</option>
        </select>
        <select className="search-filter-select" value={sortBy} onChange={e=>setSortBy(e.target.value)}>
          <option value="rating">Sort: Rating</option>
          <option value="year">Sort: Newest</option>
          <option value="title">Sort: A–Z</option>
        </select>
      </div>

      {results.length===0?(
        <div className="no-results">
          <div style={{fontSize:48,marginBottom:12,opacity:.3}}>🔍</div>
          <div style={{fontWeight:600,fontSize:16,marginBottom:6}}>No results found</div>
          <div style={{fontSize:14}}>Try adjusting your search or filters.</div>
        </div>
      ):(
        <div className="movie-grid">
          {results.map(m=>(
            <MovieCard key={m.id} movie={m} onSelect={onSelect} watchlist={watchlist} toggleWatchlist={toggleWatchlist}/>
          ))}
        </div>
      )}
    </div>
  );
}

// ── APP ROOT ──
function App(){
  const [view,        setView]        = React.useState({page:"home"});
  const [watchlist,   setWatchlist]   = React.useState(new Set([2,4]));
  const [userRatings, setUserRatings] = React.useState({2:9,4:10});
  // BUG FIX: merged liked+disliked into one state atom — eliminates stale-closure bugs
  const [reactions,   setReactions]   = React.useState({liked:new Set(),disliked:new Set()});
  const [searchQuery, setSearchQuery] = React.useState("");
  const [activeGenre, setActiveGenre] = React.useState("All");
  const [sortBy,      setSortBy]      = React.useState("rating");
  const [movies,      setMovies]      = React.useState(MOVIES);
  const [toast,       setToast]       = React.useState({show:false,msg:""});

  const showToast = React.useCallback(msg=>{
    setToast({show:true,msg});
    setTimeout(()=>setToast(t=>({...t,show:false})),2700);
  },[]);

  const toggleWatchlist = React.useCallback(id=>{
    setWatchlist(prev=>{
      const next = new Set(prev);
      const m = MOVIES.find(x=>x.id===id);
      if(next.has(id)){ next.delete(id); showToast(`Removed "${m?.title}" from watchlist`); }
      else            { next.add(id);    showToast(`Added "${m?.title}" to watchlist ✓`); }
      return next;
    });
  },[showToast]);

  const handleSetUserRating = React.useCallback((movieId,rating)=>{
    setUserRatings(p=>({...p,[movieId]:rating}));
    const m = MOVIES.find(x=>x.id===movieId);
    showToast(`Rated "${m?.title}" ${rating}/10 ⭐`);
  },[showToast]);

  // BUG FIX: both handlers update the same state object atomically — no stale cross-references
  const onLike = React.useCallback(reviewId=>{
    setReactions(prev=>{
      const liked=new Set(prev.liked), disliked=new Set(prev.disliked);
      if(liked.has(reviewId)) liked.delete(reviewId);
      else { liked.add(reviewId); disliked.delete(reviewId); }
      return {liked,disliked};
    });
  },[]);

  const onDislike = React.useCallback(reviewId=>{
    setReactions(prev=>{
      const liked=new Set(prev.liked), disliked=new Set(prev.disliked);
      if(disliked.has(reviewId)) disliked.delete(reviewId);
      else { disliked.add(reviewId); liked.delete(reviewId); }
      return {liked,disliked};
    });
  },[]);

  const addUserReview = React.useCallback((movieId,{rating,comment})=>{
    const nr = {
      id:Date.now(), user:DUMMY_USER.name, avatar:DUMMY_USER.avatar,
      color:DUMMY_USER.color, rating, verified:true, likes:0, dislikes:0,
      date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),
      comment,
    };
    setMovies(prev=>prev.map(m=>m.id!==movieId?m:{...m,reviews:[nr,...m.reviews]}));
  },[]);

  const selectedMovie = view.movieId ? movies.find(m=>m.id===view.movieId) : null;

  React.useEffect(()=>{ window.scrollTo({top:0,behavior:"smooth"}); },[view.page, view.movieId]);

  const goTo = id=>setView({page:"movie",movieId:id});
  const setQ  = React.useCallback(q=>{ setSearchQuery(q); setView(q.trim()?{page:"search"}:{page:"home"}); },[]);

  return (
    <div>
      <Navbar
        view={view} setView={setView}
        watchlistCount={watchlist.size}
        searchQuery={searchQuery}
        setSearchQuery={setQ}
      />
      <div className="page">
        {view.page==="home"&&(
          <HomePage movies={movies} onSelect={goTo} watchlist={watchlist} toggleWatchlist={toggleWatchlist}
            activeGenre={activeGenre} setActiveGenre={setActiveGenre} sortBy={sortBy} setSortBy={setSortBy}/>
        )}
        {view.page==="movie"&&selectedMovie&&(
          <DetailPage movie={selectedMovie} watchlist={watchlist} toggleWatchlist={toggleWatchlist}
            userRatings={userRatings} setUserRating={handleSetUserRating}
            reactions={reactions} onLike={onLike} onDislike={onDislike}
            onBack={()=>setView({page:"home"})} addUserReview={addUserReview}/>
        )}
        {view.page==="watchlist"&&(
          <WatchlistPage movies={movies} watchlist={watchlist} toggleWatchlist={toggleWatchlist} onSelect={goTo}/>
        )}
        {view.page==="search"&&(
          <SearchPage movies={movies} query={searchQuery} onSelect={goTo}
            watchlist={watchlist} toggleWatchlist={toggleWatchlist}/>
        )}
      </div>
      <Toast message={toast.msg} show={toast.show}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
